name: specnfc

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: specnfc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Spec nfc
        run: npm install --global spec-nfc@{{specnfcVersion}}
      - name: Protocol gate
        run: specnfc ci --json
      - name: Agent skills
        run: specnfc skills validate